<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- §7 v2 mark — "signal bar": a sharp waveform pulse, pure monochrome,
       no hue dependency, legible at 16px. Rounded-square tile on the near-black
       canvas; the pulse reads as signal, not decoration. -->
  <rect width="64" height="64" rx="14" fill="#08090A"/>
  <path d="M10 32h11l5-16 7 32 5-16h16"
        fill="none" stroke="#F7F8F8" stroke-width="5"
        stroke-linecap="square" stroke-linejoin="miter"/>
</svg>
